# The long form of the Python repositories in testdata/config/sindri.yaml,
# with every inference and default written out.
kind: Repository
metadata:
  name: internal-py
spec:
  type: hosted
  protocol: pypi
  access:
    read: [team:platform, team:payments]
    write: [team:platform]
---
kind: Repository
metadata:
  name: pypi
spec:
  type: proxy
  protocol: pypi
  upstream:
    url: https://pypi.org/simple
    ttl: 30m
    negativeTtl: 5m
  access:
    read: [authenticated]
---
kind: Repository
metadata:
  name: python
spec:
  type: virtual
  protocol: pypi
  members:
    - ref: hosted/internal-py
    - ref: proxy/pypi
  access:
    read: [team:platform, team:payments]
