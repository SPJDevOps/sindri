# Sindri against the development stack in this directory, from source:
#
#   make up && make run
#
# then open http://localhost:8080/ui/. Dex signs you in as an example user,
# who administers this server. DEVELOPMENT ONLY: never point a deployment at
# this file.
# Loopback only: the bootstrap token below is public knowledge, so this
# server must not be reachable from the network. Docker Desktop's daemon
# still reaches it as host.docker.internal:8080.
listen: ${SINDRI_LISTEN:-127.0.0.1:8080}
# Relative paths resolve against this file, so this is ./data at the
# repository root, which git ignores.
storage: ${SINDRI_DATA_DIR:-../../data}
database: postgres://sindri:sindri@127.0.0.1:${SINDRI_PG_PORT:-55432}/sindri?sslmode=disable
log: info

auth:
  # The bootstrap administrator token, for docker login and the API.
  static_token: ${SINDRI_TOKEN:-sindri-dev-token}
  admins: [authors]
  oidc:
    issuer: http://localhost:5556/dex
    clientId: sindri
    clientSecret: development-not-a-secret
    redirectUrl: http://localhost:8080/auth/callback
    scopes: [openid, profile, email, groups]
