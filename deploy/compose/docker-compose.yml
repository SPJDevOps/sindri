# Local development dependencies for Sindri: Postgres, a MinIO S3-compatible
# object store, and Dex, an identity provider for signing in to the web UI.
# Sindri itself runs from source against them:
#
#   make up     start
#   make run    build and serve with deploy/compose/sindri.yaml, signed-in UI
#               at http://localhost:8080/ui/
#   make logs   follow
#   make down   stop and delete volumes
#
# Host ports default high to avoid colliding with anything you already run.
# Override them per shell or in a .env file next to this file:
#   SINDRI_PG_PORT=5432 SINDRI_S3_PORT=9000 SINDRI_S3_CONSOLE_PORT=9001 make up
#
# Dex stays on 5556: its issuer URL is part of every token it signs, so the
# port is fixed in both its configuration and deploy/compose/sindri.yaml.

name: sindri-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sindri
      POSTGRES_PASSWORD: sindri
      POSTGRES_DB: sindri
      # Fail fast on an unreadable locale rather than at first query.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${SINDRI_PG_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindri -d sindri"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    # Bitnami's archived build, and pinned: MinIO's own images stopped serving
    # anonymous pulls on both Docker Hub and quay.io, and "latest" is not a
    # quickstart anyone can reproduce. See ADR 11.
    #
    # This image runs its own entrypoint as a non-root user, so it takes no
    # `command:` and keeps its data under /bitnami, not /data.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sindri
      MINIO_ROOT_PASSWORD: sindri-dev-secret
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "127.0.0.1:${SINDRI_S3_PORT:-59000}:9000"           # S3 API
      - "127.0.0.1:${SINDRI_S3_CONSOLE_PORT:-59001}:9001"   # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: create the bucket Sindri expects, then exit.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sindri sindri-dev-secret &&
      mc mb --ignore-existing local/sindri-blobs &&
      echo 'bucket sindri-blobs ready'
      "
    restart: "no"

  # DEVELOPMENT ONLY. The mock connector signs in anyone who opens the
  # browser as an example user in the `authors` group, and
  # deploy/compose/sindri.yaml makes `authors` administrators. There is no
  # password anywhere in this flow.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    configs:
      - source: dex
        target: /etc/dex/config.yaml
    ports:
      - "127.0.0.1:5556:5556"

configs:
  dex:
    content: |
      issuer: http://localhost:5556/dex
      storage:
        type: memory
      web:
        http: 0.0.0.0:5556
      oauth2:
        skipApprovalScreen: true
      staticClients:
        - id: sindri
          name: Sindri (development)
          secret: development-not-a-secret
          redirectURIs: ["http://localhost:8080/auth/callback"]
      connectors:
        - type: mockCallback
          id: mock
          name: Example user

volumes:
  postgres-data:
  minio-data:
