name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release binary is built with this Go, so it carries this standard
  # library: keep it on the newest patch release. Keep it equal to the
  # toolchain `make tools` builds golangci-lint with; a linter built with an
  # older Go cannot read a newer standard library's export data.
  GO_VERSION: "1.27.4"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: make fmt-check
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Helm chart
        run: make lint-chart
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # .golangci.yml sets the integration build tag, so the suites that
          # touch real Postgres and real S3 are linted too.
          args: --timeout=5m

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Real Postgres and real MinIO through testcontainers, which needs the
    # Docker daemon the runner already provides.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # TestHelm_ drives the real helm client and fails, rather than skips,
      # when CI is set and helm is missing.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      # TestNpm_ drives the real npm client and fails, rather than skips,
      # when CI is set and npm is missing.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # TestRealTrivy_ runs the real Trivy. With none on PATH it copies the
      # binary out of the image pinned in internal/testsupport/trivy.go, and
      # fails, rather than skips, when CI is set and that or the database
      # download does not work.
      - name: Test
        run: make test-integration

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned mdBook and lychee, checked against the sums in the script.
      - name: Install docs tools
        run: |
          ./scripts/install-docs-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the site and check its links
        run: make docs

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build
