name: Release

# A v* tag publishes binaries, checksums, and a multi-architecture image to
# ghcr.io/spjdevops/sindri, plus a `-trivy` image variant (ADR 23).
# `goreleaser release --snapshot --clean` builds the same artifacts locally
# without publishing anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub release and its assets
  packages: write   # the image on ghcr.io

# Third-party actions are pinned to commit SHAs: this job can write releases
# and images, so a moved tag must not be able to change what it runs.
# Dependabot bumps the SHAs; the comment keeps the version readable.
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Kept equal to ci.yml's GO_VERSION.
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Helm chart, versioned as the release tag so that it names exactly one
  # image, and pushed only once that image exists (ADR 28).
  chart:
    name: Helm chart
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the chart on ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package charts/sindri --version "$version" --app-version "$version"
          helm push "sindri-$version.tgz" oci://ghcr.io/spjdevops/charts

  # The docs site, published to GitHub Pages once the release itself is out,
  # so the site never describes a version that failed to publish (ADR 26).
  # Pages must be set to "GitHub Actions" in the repository settings, and the
  # github-pages environment it creates must allow v* tags: by default it
  # deploys only from the default branch. Pre-release tags do not publish.
  pages:
    name: Docs site
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write      # deploy to Pages
      id-token: write   # the OIDC token deploy-pages verifies the deployment with
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install docs tools
        run: |
          ./scripts/install-docs-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the site and check its links
        run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
