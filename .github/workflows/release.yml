name: Release

# A v* tag publishes binaries, checksums, and a multi-architecture image to
# ghcr.io/spjdevops/sindri. `goreleaser release --snapshot --clean` builds the
# same artifacts locally without publishing anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub release and its assets
  packages: write   # the image on ghcr.io

# Third-party actions are pinned to commit SHAs: this job can write releases
# and images, so a moved tag must not be able to change what it runs.
# Dependabot bumps the SHAs; the comment keeps the version readable.
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Kept equal to ci.yml's GO_VERSION.
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The docs site, published to GitHub Pages once the release itself is out,
  # so the site never describes a version that failed to publish (ADR 26).
  # Pages must be set to "GitHub Actions" in the repository settings.
  pages:
    name: Docs site
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # deploy to Pages
      id-token: write   # the OIDC token deploy-pages verifies the deployment with
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install docs tools
        run: |
          ./scripts/install-docs-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the site and check its links
        run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
