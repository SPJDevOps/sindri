name: Release

# A v* tag publishes binaries, checksums, and a multi-architecture image to
# ghcr.io/spjdevops/sindri. `goreleaser release --snapshot --clean` builds the
# same artifacts locally without publishing anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub release and its assets
  packages: write   # the image on ghcr.io

# Third-party actions are pinned to commit SHAs: this job can write releases
# and images, so a moved tag must not be able to change what it runs.
# Dependabot bumps the SHAs; the comment keeps the version readable.
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Kept equal to ci.yml's GO_VERSION.
          go-version: "1.27.1"
          cache: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
